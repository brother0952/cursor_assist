<!DOCTYPE html>
<html>
<head>
    <title>Jinja2 复杂示例</title>
</head>
<body>
    <h1>数据展示</h1>
    
        <!-- 如果上一个键是 divider_before 或当前键是 divider_after，则显示分隔线 -->
        
        
        <div class="item">
            <strong>product:</strong> 笔记本电脑
        </div>
        
        <!-- 如果当前键是 divider_after，则在后面显示分隔线 -->
        
    
        <!-- 如果上一个键是 divider_before 或当前键是 divider_after，则显示分隔线 -->
        
        
        <div class="item">
            <strong>price:</strong> 5999
        </div>
        
        <!-- 如果当前键是 divider_after，则在后面显示分隔线 -->
        
    
        <!-- 如果上一个键是 divider_before 或当前键是 divider_after，则显示分隔线 -->
        
        
        <div class="item">
            <strong>divider_after:</strong> 这个后面有分割线
        </div>
        
        <!-- 如果当前键是 divider_after，则在后面显示分隔线 -->
        
            <hr />******
        
    
        <!-- 如果上一个键是 divider_before 或当前键是 divider_after，则显示分隔线 -->
        
        
        <div class="item">
            <strong>spec:</strong> i7处理器，16GB内存
        </div>
        
        <!-- 如果当前键是 divider_after，则在后面显示分隔线 -->
        
    
        <!-- 如果上一个键是 divider_before 或当前键是 divider_after，则显示分隔线 -->
        
            <hr />******
        
        
        <div class="item">
            <strong>divider_before:</strong> 这个前面有分割线
        </div>
        
        <!-- 如果当前键是 divider_after，则在后面显示分隔线 -->
        
    
        <!-- 如果上一个键是 divider_before 或当前键是 divider_after，则显示分隔线 -->
        
        
        <div class="item">
            <strong>features:</strong> 轻薄便携，长续航
        </div>
        
        <!-- 如果当前键是 divider_after，则在后面显示分隔线 -->
        
    
        <!-- 如果上一个键是 divider_before 或当前键是 divider_after，则显示分隔线 -->
        
        
        <div class="item">
            <strong>rating:</strong> 4.8
        </div>
        
        <!-- 如果当前键是 divider_after，则在后面显示分隔线 -->
        
    
</body>
</html>
