<!DOCTYPE html>
<html>
<head>
    <title>Jinja2 复杂示例</title>
</head>
<body>
    <h1>数据展示</h1>
    
        <!-- 如果上一个键是 divider_before 或当前键是 divider_after，则显示分隔线 -->
        
        
        <div class="item">
            <strong>name:</strong> 张三
        </div>
        
        <!-- 如果当前键是 divider_after，则在后面显示分隔线 -->
        
    
        <!-- 如果上一个键是 divider_before 或当前键是 divider_after，则显示分隔线 -->
        
        
        <div class="item">
            <strong>age:</strong> 30
        </div>
        
        <!-- 如果当前键是 divider_after，则在后面显示分隔线 -->
        
    
        <!-- 如果上一个键是 divider_before 或当前键是 divider_after，则显示分隔线 -->
        
            <hr />******
        
        
        <div class="item">
            <strong>divider_before:</strong> 这个键前面会有一个分割线
        </div>
        
        <!-- 如果当前键是 divider_after，则在后面显示分隔线 -->
        
    
        <!-- 如果上一个键是 divider_before 或当前键是 divider_after，则显示分隔线 -->
        
        
        <div class="item">
            <strong>special_item:</strong> 这是一个特殊项目
        </div>
        
        <!-- 如果当前键是 divider_after，则在后面显示分隔线 -->
        
    
        <!-- 如果上一个键是 divider_before 或当前键是 divider_after，则显示分隔线 -->
        
        
        <div class="item">
            <strong>city:</strong> 北京
        </div>
        
        <!-- 如果当前键是 divider_after，则在后面显示分隔线 -->
        
    
        <!-- 如果上一个键是 divider_before 或当前键是 divider_after，则显示分隔线 -->
        
        
        <div class="item">
            <strong>divider_after:</strong> 这个键后面会有一个分割线
        </div>
        
        <!-- 如果当前键是 divider_after，则在后面显示分隔线 -->
        
            <hr />******
        
    
        <!-- 如果上一个键是 divider_before 或当前键是 divider_after，则显示分隔线 -->
        
        
        <div class="item">
            <strong>job:</strong> 程序员
        </div>
        
        <!-- 如果当前键是 divider_after，则在后面显示分隔线 -->
        
    
        <!-- 如果上一个键是 divider_before 或当前键是 divider_after，则显示分隔线 -->
        
        
        <div class="item">
            <strong>hobby:</strong> 编程
        </div>
        
        <!-- 如果当前键是 divider_after，则在后面显示分隔线 -->
        
    
</body>
</html>
